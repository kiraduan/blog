---
layout: default
---
<h1>最新文章</h1>
<ul class="post-list">
{% for post in site.posts %}
  <li>
    <span class="post-date">{{ post.date | date: "%Y-%m-%d" }}</span>
    <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
  </li>
{% endfor %}
</ul>
{% if site.posts.size == 0 %}
<p>还没有文章，去 _posts 文件夹里新建一篇吧。</p>
{% endif %}
